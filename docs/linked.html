<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Axiom</title>
<!-- Where Discord linking (server/supabase/functions/discord-link) sends the
     browser back: ?r= says how it went. Published on the Axiom-releases
     repository's GitHub Pages (docs/linked.html). -->
<style>
  :root { --bg: #151515; --card: #1b1b1b; --border: #252525; --title: #ebebeb; --text: #b4b4b4; --muted: #767676; --good: #5ecf8f; --bad: #eb7366; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 28px 24px 22px; text-align: center; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 9px; color: var(--title); font-size: 20px; font-weight: 600; margin-bottom: 22px; }
  .brand svg { width: 20px; height: 20px; fill: var(--title); }
  .mark { width: 42px; height: 42px; border-radius: 21px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }
  .mark svg { width: 20px; height: 20px; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .good .mark { background: rgba(94, 207, 143, 0.14); } .good .mark svg { stroke: var(--good); }
  .bad .mark { background: rgba(235, 115, 102, 0.14); } .bad .mark svg { stroke: var(--bad); }
  h1 { color: var(--title); font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p { margin: 0; }
  .note { color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand">
    <svg viewBox="19 20 82 80" aria-hidden="true"><path d="M44 20H76Q80 20 81.4 25L100.3 94 82 100 65 38H55L38 100 19.6 94 38.6 25Q40 20 44 20Z"/><path d="M45.6 65H62.4L67 82H41Z"/></svg>
    Axiom
  </div>
  <div class="mark" id="mark"></div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <p class="note">이 창은 닫아도 됩니다 · You can close this window</p>
</main>
<script>
  // How it went: its heading and words, in Korean then English.
  const results = {
    ok:        [true,  "디스코드가 연결되었습니다", "Discord is linked to your account."],
    buyer:     [true,  "디스코드가 연결되었습니다", "Discord is linked to your account.<br>구매자 채널이 열렸습니다. · The buyer channel is open to you."],
    cancelled: [false, "연결이 취소되었습니다", "Discord linking was cancelled.<br>앱에서 Connect Discord를 다시 눌러 주세요."],
    expired:   [false, "연결 링크가 만료되었습니다", "This link ran out.<br>앱에서 Connect Discord를 다시 눌러 주세요."],
    failed:    [false, "디스코드에서 확인하지 못했습니다", "Discord couldn't confirm it. Try again in a moment.<br>잠시 후 다시 시도해 주세요."],
  };
  const r = results[new URLSearchParams(location.search).get("r")] || results.failed;
  document.getElementById("card").className = "card " + (r[0] ? "good" : "bad");
  document.getElementById("mark").innerHTML = r[0]
    ? '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  document.getElementById("title").textContent = r[1];
  document.getElementById("text").innerHTML = r[2];
</script>
</body>
</html>
